<!doctype html><html lang="hi" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Settings · राम जाने</title>

<link rel="stylesheet" href="assets/style.css"><script src="data/kb.js"></script><script src="data/links.js"></script><script src="data/news.js"></script><script src="data/market.js"></script><script src="assets/app.js"></script></head><body><script>mountNav('settings.html')</script><main><h1>⚙ Settings</h1><p class="sub">अपने लिंक बदलें (केवल इस ब्राउज़र में सेव) और डेटा का बैकअप लें।</p><div class="card" id="sl"></div><div class="row"><button class="btn" onclick="saveL()">लिंक सेव करें</button><button class="btn g" onclick="exportAll()">⬇ पूरा बैकअप</button><label class="btn g" style="margin:0">⬆ बैकअप इम्पोर्ट<input type="file" accept=".json" style="display:none" onchange="importAll(this.files[0])"></label></div><div class="warn">इस साइट पर पासवर्ड, API-कुंजी, खाता-संख्या या ट्रेडिंग-लॉगिन कभी न डालें। साइट सार्वजनिक है; आपका डेटा केवल ब्राउज़र में रहता है।</div></main><script>mountFooter();
var L=getLinks(),nm={youtube:'YouTube',instagram:'Instagram',facebook:'Facebook',x:'X',linkedin:'LinkedIn',urbanpro:'UrbanPro',teacheron:'TeacherOn',mathvani:'MATHVANI वेबसाइट',ignou:'IGNOU (अपने विद्यार्थी-पेज का सटीक लिंक डालें)',kindle:'Kindle लाइब्रेरी',gemini:'Gemini',chatgpt:'ChatGPT',claude:'Claude',upstox:'Upstox',chartink:'Chartink',screener:'Screener',tradingview:'TradingView चार्ट'};

window.saveL=function(){var o={};$$('#sl input').forEach(function(i){o[i.dataset.k]=i.value.trim()});store.set('links',o);alert('सेव हो गया')};</script></body></html>
