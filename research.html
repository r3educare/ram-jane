<!doctype html><html lang="hi" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Research · राम जाने</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Serif+Devanagari:wght@600;700&family=Playfair+Display:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css"><script src="data/kb.js"></script><script src="data/links.js"></script><script src="data/news.js"></script><script src="data/market.js"></script><script src="assets/app.js"></script></head><body><script>mountNav('research.html')</script><main><h1>🗂 Research Library</h1><p class="sub">नोट्स, लिंक और वीडियो सेव करें: टैग और खोज के साथ। डेटा सिर्फ़ इस ब्राउज़र में रहता है; दूसरे डिवाइस के लिए "एक्सपोर्ट" से फ़ाइल लेकर वहाँ "इम्पोर्ट" करें।</p>
<div class="row"><div><label>खोज</label><input id="q" placeholder="शब्द या #टैग"></div><button class="btn g" onclick="exportAll()">⬇ एक्सपोर्ट (सारा डेटा)</button><label class="btn g" style="margin:0">⬆ इम्पोर्ट<input type="file" accept=".json" style="display:none" onchange="importAll(this.files[0])"></label></div>
<div class="tabs"><button data-t="tn">📝 नोट्स</button><button data-t="tv">▶ वीडियो</button></div>
<section class="panel" id="tn"><div class="card"><div class="row"><div><label>शीर्षक</label><input id="nt"></div><div><label>टैग (अल्पविराम से)</label><input id="ng" placeholder="चेतना, ध्यान, बाज़ार"></div></div><div class="row"><div><label>लिंक (वैकल्पिक)</label><input id="nu" placeholder="https://"></div></div><label>नोट</label><textarea id="nb" rows="5"></textarea><div class="row"><button class="btn" onclick="addN()">सेव करें</button></div></div><div id="nl"></div></section>
<section class="panel" id="tv"><div class="card"><div class="row"><div><label>YouTube लिंक</label><input id="vu" placeholder="https://youtu.be/…"></div><div><label>शीर्षक</label><input id="vt"></div></div><div class="row"><div><label>टैग</label><input id="vg"></div><div><label>नोट/समय-चिह्न</label><input id="vn"></div><button class="btn" onclick="addV()">सेव</button></div></div><div id="vl"></div></section></main><script>mountFooter();
initTabs();
function tags(s){return String(s||'').split(',').map(function(x){return x.trim()}).filter(Boolean)}
function match(o,q){if(!q)return true;q=q.toLowerCase();return JSON.stringify(o).toLowerCase().indexOf(q.replace('#',''))>-1}
function ytid(u){var m=String(u).match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/);return m?m[1]:null}
window.renderR=function(){var q=$('#q').value.trim(),N=store.get('notes',[]),V=store.get('videos',[]);
$('#nl').innerHTML=N.filter(function(o){return match(o,q)}).map(function(o){return '<div class="item"><div><b>'+esc(o.t)+'</b> '+tags(o.g).map(function(x){return '<span class="tag">'+esc(x)+'</span>'}).join('')+'<div style="white-space:pre-wrap;margin-top:4px">'+esc(o.b)+'</div>'+(o.u?'<a href="'+esc(o.u)+'" target="_blank" rel="noopener">'+esc(o.u)+'</a>':'')+'</div><button class="x" onclick="delR(\'notes\',\''+o.id+'\')">✕</button></div>'}).join('')||'<div class="note">अभी कोई नोट नहीं</div>';
$('#vl').innerHTML=V.filter(function(o){return match(o,q)}).map(function(o){var id=ytid(o.u);return '<div class="item"><div class="vid">'+(id?'<img src="https://img.youtube.com/vi/'+id+'/mqdefault.jpg" alt="">':'')+'<div><b><a href="'+esc(o.u)+'" target="_blank" rel="noopener">'+esc(o.t||o.u)+'</a></b> '+tags(o.g).map(function(x){return '<span class="tag">'+esc(x)+'</span>'}).join('')+'<div>'+esc(o.n)+'</div></div></div><button class="x" onclick="delR(\'videos\',\''+o.id+'\')">✕</button></div>'}).join('')||'<div class="note">अभी कोई वीडियो नहीं</div>'}
window.addN=function(){var t=$('#nt').value.trim(),b=$('#nb').value.trim();if(!t&&!b)return;var N=store.get('notes',[]);N.unshift({id:uid(),t:t||'(बिना शीर्षक)',b:b,g:$('#ng').value,u:$('#nu').value.trim()});store.set('notes',N);['nt','nb','ng','nu'].forEach(function(i){$('#'+i).value=''});renderR()};
window.addV=function(){var u=$('#vu').value.trim();if(!u)return;var V=store.get('videos',[]);V.unshift({id:uid(),u:u,t:$('#vt').value.trim(),g:$('#vg').value,n:$('#vn').value});store.set('videos',V);['vu','vt','vg','vn'].forEach(function(i){$('#'+i).value=''});renderR()};
window.delR=function(k,id){if(!confirm('हटाएँ?'))return;store.set(k,store.get(k,[]).filter(function(o){return o.id!==id}));renderR()};
$('#q').addEventListener('input',renderR);renderR();</script></body></html>
