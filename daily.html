<!doctype html><html lang="hi" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Daily Log & Files · राम जाने</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Serif+Devanagari:wght@600;700&family=Playfair+Display:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css"><script src="data/kb.js"></script><script src="data/links.js"></script><script src="data/news.js"></script><script src="data/market.js"></script><script src="assets/app.js"></script></head><body><script>mountNav('daily.html')</script><main><h1>Daily Log & Files</h1><p class="sub">Day-wise points you can revisit any time, and a private shelf for PDFs</p><input id="flt" class="search" placeholder="Search this page… (नाम / name / ministry / site)"><div class="tabs"><button data-t="s0">Daily Log</button><button data-t="s1">Files (PDF shelf)</button></div><section class="panel" id="s0"><div class="card"><div class="row"><div><label>Date</label><input id="dd" type="date"></div><div><label>Tag</label><select id="dtg"></select></div></div><label>Point / update of the day</label><textarea id="dtx" rows="3" placeholder="What did I do, learn, decide? Money? Meditation? Ideas?"></textarea><p><button class="btn" id="dsv">Save point</button> <span class="mut" id="dst"></span></p></div><h3>Browse past days</h3><div class="row"><div><label>Search</label><input id="dq" placeholder="search text"></div><div><label>Tag</label><select id="ftag"></select></div><div><label>From</label><input id="dfrom" type="date"></div><div><label>To</label><input id="dto" type="date"></div><button class="btn s g" id="dclr">Clear</button></div><div id="dlist"></div></section><section class="panel" id="s1"><div class="note">Files are stored <b>inside this browser</b> (IndexedDB) and never uploaded anywhere. They are not part of the JSON backup, so keep originals elsewhere. Clearing site data deletes them.</div><div class="card"><div class="row"><div><label>Category</label><select id="fcat2"><option>Books/PDF</option><option>Notes</option><option>Research</option><option>Maths material</option><option>Receipts/Docs</option><option>Other</option></select></div><div><label>Note (optional)</label><input id="fnote"></div></div><label>Choose PDFs / files</label><input type="file" id="fup" multiple></div><div class="row"><div><label>Search</label><input id="fq"></div><div><label>Category</label><select id="fcat"><option value="">All</option><option>Books/PDF</option><option>Notes</option><option>Research</option><option>Maths material</option><option>Receipts/Docs</option><option>Other</option></select></div></div><div class="mut" id="fst"></div><div id="fl"></div></section></main><script>mountFooter();initTabs();initFilter();var TAGS=['Work','Research','Meditation','Money','Family','Idea','Learning','Health'];
function tdy(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
$('#dd').value=tdy();$('#dtg').innerHTML=TAGS.map(function(t){return '<option>'+t+'</option>'}).join('');$('#ftag').innerHTML='<option value="">All tags</option>'+TAGS.map(function(t){return '<option>'+t+'</option>'}).join('');
var editI=null;
function dlDraw(){var D=store.get('dl',[]);var q=$('#dq').value.toLowerCase(),tg=$('#ftag').value,f=$('#dfrom').value,t=$('#dto').value;
 var L=D.filter(function(x){return (!q||(x.txt+' '+x.tag).toLowerCase().indexOf(q)>-1)&&(!tg||x.tag===tg)&&(!f||x.d>=f)&&(!t||x.d<=t)}).sort(function(a,b){return a.d===b.d?(a.t<b.t?1:-1):(a.d<b.d?1:-1)});
 var days={};L.forEach(function(x){(days[x.d]=days[x.d]||[]).push(x)});
 $('#dst').textContent=D.length+' points · '+Object.keys(D.reduce(function(a,x){a[x.d]=1;return a},{})).length+' days recorded';
 $('#dlist').innerHTML=Object.keys(days).sort().reverse().map(function(d){var dt=new Date(d+'T00:00');return '<div class="card" style="margin:10px 0"><b style="color:var(--gold2)">'+dt.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</b>'+days[d].map(function(x){return '<div class="item"><div><span class="tag">'+esc(x.tag)+'</span> <span class="mut">'+esc(x.t)+'</span><div style="white-space:pre-wrap">'+esc(x.txt)+'</div></div><span><button class="x" data-e="'+x.id+'">✎</button><button class="x" data-x="'+x.id+'">✕</button></span></div>'}).join('')+'</div>'}).join('')||'<div class="note">Nothing found. Add today’s first point above.</div>';
 $$('#dlist [data-x]').forEach(function(b){b.onclick=function(){if(!confirm('Delete this point?'))return;store.set('dl',store.get('dl',[]).filter(function(x){return x.id!==b.dataset.x}));dlDraw()}});
 $$('#dlist [data-e]').forEach(function(b){b.onclick=function(){var x=store.get('dl',[]).filter(function(y){return y.id===b.dataset.e})[0];editI=x.id;$('#dd').value=x.d;$('#dtg').value=x.tag;$('#dtx').value=x.txt;$('#dsv').textContent='Update';window.scrollTo({top:0,behavior:'smooth'});$('#dtx').focus()}})}
$('#dsv').onclick=function(){var tx=$('#dtx').value.trim();if(!tx)return;var D=store.get('dl',[]);var n=new Date(),tm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
 if(editI){D=D.map(function(x){return x.id===editI?{id:x.id,d:$('#dd').value,t:x.t,tag:$('#dtg').value,txt:tx}:x});editI=null;$('#dsv').textContent='Save point'}else D.push({id:uid(),d:$('#dd').value,t:tm,tag:$('#dtg').value,txt:tx});
 store.set('dl',D);$('#dtx').value='';dlDraw()};
['dq','ftag','dfrom','dto'].forEach(function(i){$('#'+i).addEventListener('input',dlDraw)});$('#dclr').onclick=function(){['dq','ftag','dfrom','dto'].forEach(function(i){$('#'+i).value=''});dlDraw()};
dlDraw();
// ---- files in IndexedDB ----
var DB=null;function idb(cb){if(DB)return cb(DB);var r=indexedDB.open('vcc_files',1);r.onupgradeneeded=function(){r.result.createObjectStore('f',{keyPath:'id'})};r.onsuccess=function(){DB=r.result;cb(DB)};r.onerror=function(){$('#fl').innerHTML='<div class="note">This browser blocks file storage (private mode?).</div>'}}
function fdraw(){idb(function(db){var rq=db.transaction('f').objectStore('f').getAll();rq.onsuccess=function(){var A=rq.result.sort(function(a,b){return b.at-a.at});var cat=$('#fcat').value;var q=$('#fq').value.toLowerCase();A=A.filter(function(x){return (!cat||x.cat===cat)&&(!q||(x.name+' '+(x.note||'')).toLowerCase().indexOf(q)>-1)});
 $('#fl').innerHTML=A.map(function(x){return '<div class="item"><div><b>'+esc(x.name)+'</b> <span class="tag">'+esc(x.cat||'')+'</span> <span class="mut">'+(x.size/1048576).toFixed(2)+' MB · '+new Date(x.at).toLocaleDateString('en-IN')+'</span>'+(x.note?'<div class="mut">'+esc(x.note)+'</div>':'')+'</div><span><button class="btn s" data-o="'+x.id+'">Open</button> <button class="btn s g" data-dl="'+x.id+'">Download</button> <button class="x" data-r="'+x.id+'">✕</button></span></div>'}).join('')||'<div class="note">No files yet.</div>';
 function get(id,cb2){var g=db.transaction('f').objectStore('f').get(id);g.onsuccess=function(){cb2(g.result)}}
 $$('#fl [data-o]').forEach(function(b){b.onclick=function(){get(b.dataset.o,function(x){window.open(URL.createObjectURL(x.blob),'_blank')})}});
 $$('#fl [data-dl]').forEach(function(b){b.onclick=function(){get(b.dataset.dl,function(x){var a=document.createElement('a');a.href=URL.createObjectURL(x.blob);a.download=x.name;a.click()})}});
 $$('#fl [data-r]').forEach(function(b){b.onclick=function(){if(!confirm('Remove this file from the browser? (Your original on your device is not touched.)'))return;var tr=db.transaction('f','readwrite');tr.objectStore('f').delete(b.dataset.r);tr.oncomplete=fdraw}});
 if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(function(e){$('#fst').textContent='Browser storage used: '+(e.usage/1048576).toFixed(1)+' MB of about '+(e.quota/1048576/1024).toFixed(1)+' GB available (browser-decided)'})}})}
$('#fup').addEventListener('change',function(){var fs=Array.prototype.slice.call(this.files);if(!fs.length)return;idb(function(db){var tr=db.transaction('f','readwrite'),os=tr.objectStore('f');fs.forEach(function(f){os.put({id:uid(),name:f.name,size:f.size,cat:$('#fcat2').value,note:$('#fnote').value,at:Date.now(),blob:f})});tr.oncomplete=function(){$('#fup').value='';$('#fnote').value='';fdraw()}})});
['fcat','fq'].forEach(function(i){$('#'+i).addEventListener('input',fdraw)});fdraw();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();</script></body></html>
