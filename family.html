<!doctype html><html lang="hi" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Family Timeline · राम जाने</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Serif+Devanagari:wght@600;700&family=Playfair+Display:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css"><script src="data/kb.js"></script><script src="data/links.js"></script><script src="data/news.js"></script><script src="data/market.js"></script><script src="assets/app.js"></script></head><body><script>mountNav('family.html')</script><main><h1 id="fn">Family Timeline</h1><p class="sub">Events, milestones and plans — a private timeline</p><div class="tabs"><button data-t="a">Timeline</button><button data-t="b">Goals & Plans</button></div><section class="panel" id="a"><div class="note">Everything here stays only in your browser (never on the public website). You can set a name below; it is saved only on this device.</div><div class="row"><div><label>Name for this page (optional, stored locally)</label><input id="fni"></div><button class="btn s" id="fns">Set</button></div><div class="card"><div class="row"><div><label>Date</label><input id="fdt" type="date"></div><div><label>Type</label><select id="fc"></select></div><div style="flex:2"><label>Event</label><input id="ft" placeholder="e.g. exam result, admission, achievement, trip"></div></div><label>Notes</label><textarea id="fnn" rows="2"></textarea><p><button class="btn" id="fsv">Add to timeline</button></p></div><div class="row" style="align-items:end"><div><label>Filter</label><select id="ffc"></select></div><button class="btn s g" id="fsort">Newest first</button></div><div id="ftl"></div></section><section class="panel" id="b"><div id="fgo"></div></section></main><script>mountFooter();initTabs();var nm=store.get('fam_name','');function head(){$('#fn').textContent=(nm?nm+' — ':'')+'Family Timeline'}head();
$('#fns').onclick=function(){nm=$('#fni').value.trim();store.set('fam_name',nm);head()};$('#fni').value=nm;
var CATS=['Milestone','Education','Health','Achievement','Memory','Plan / Upcoming'];$('#fc').innerHTML=CATS.map(function(c){return '<option>'+c+'</option>'}).join('');$('#ffc').innerHTML='<option value="">All</option>'+CATS.map(function(c){return '<option>'+c+'</option>'}).join('');
var asc=false;function fd(){var D=store.get('fam',[]);var c=$('#ffc').value;D=D.filter(function(x){return !c||x.c===c}).sort(function(a,b){return asc?(a.d<b.d?-1:1):(a.d<b.d?1:-1)});var tdy=new Date().toISOString().slice(0,10);
 $('#ftl').innerHTML=D.length?'<div class="tlv">'+D.map(function(x){return '<div class="ev'+(x.d>tdy?' f':'')+'"><div class="d">'+new Date(x.d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+(x.d>tdy?' · upcoming':'')+' · <span class="tag">'+esc(x.c)+'</span></div><b>'+esc(x.t)+'</b>'+(x.n?'<div class="mut" style="white-space:pre-wrap">'+esc(x.n)+'</div>':'')+'<div><button class="x" data-e="'+x.id+'">✎</button><button class="x" data-x="'+x.id+'">✕</button></div></div>'}).join('')+'</div>':'<div class="note">No events yet. Add the first milestone.</div>';
 $$('#ftl [data-x]').forEach(function(b){b.onclick=function(){if(!confirm('Delete?'))return;store.set('fam',store.get('fam',[]).filter(function(x){return x.id!==b.dataset.x}));fd()}});
 $$('#ftl [data-e]').forEach(function(b){b.onclick=function(){var x=store.get('fam',[]).filter(function(y){return y.id===b.dataset.e})[0];fe=x.id;$('#fdt').value=x.d;$('#fc').value=x.c;$('#ft').value=x.t;$('#fnn').value=x.n||'';$('#fsv').textContent='Update';window.scrollTo({top:0,behavior:'smooth'})}})}
var fe=null;$('#fsv').onclick=function(){var t=$('#ft').value.trim(),d=$('#fdt').value;if(!t||!d)return;var D=store.get('fam',[]);var o={id:fe||uid(),d:d,c:$('#fc').value,t:t,n:$('#fnn').value.trim()};if(fe){D=D.map(function(x){return x.id===fe?o:x});fe=null;$('#fsv').textContent='Add to timeline'}else D.push(o);store.set('fam',D);$('#ft').value='';$('#fnn').value='';fd()};
$('#ffc').onchange=fd;$('#fsort').onclick=function(){asc=!asc;this.textContent=asc?'Oldest first':'Newest first';fd()};fd();
mountCollection('fgo','famgoals',['Education','Skills','Health','Values & time together','Other'],{fields:[['t','Goal'],['p','% done'],['n','Plan / notes']]});</script></body></html>
